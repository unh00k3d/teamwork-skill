<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" role="img" aria-label="How teamwork works: you talk to the anchor, the anchor spawns a lead in tmux, the lead staffs members, and everyone coordinates through TEAM.md" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="778" height="428" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- you -->
  <rect x="40" y="62" width="100" height="44" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
  <text x="90" y="89" text-anchor="middle" fill="#e6edf3" font-size="15">you</text>

  <!-- you <-> anchor -->
  <line x1="90" y1="112" x2="90" y2="184" stroke="#8b949e" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="102" y="144" fill="#8b949e" font-size="12">status,</text>
  <text x="102" y="160" fill="#8b949e" font-size="12">steering</text>

  <!-- anchor -->
  <rect x="40" y="190" width="100" height="44" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
  <text x="90" y="209" text-anchor="middle" fill="#e6edf3" font-size="15">anchor</text>
  <text x="90" y="226" text-anchor="middle" fill="#8b949e" font-size="11">your session</text>

  <!-- tmux boundary -->
  <rect x="220" y="40" width="520" height="230" rx="12" fill="none" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="238" y="64" fill="#8b949e" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">tmux — one session per member</text>

  <!-- anchor -> lead -->
  <line x1="146" y1="212" x2="254" y2="212" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="200" y="202" text-anchor="middle" fill="#8b949e" font-size="12">spawns</text>

  <!-- lead -->
  <rect x="260" y="190" width="110" height="44" rx="8" fill="#161b22" stroke="#2dd4a7" stroke-width="1.5"/>
  <text x="315" y="217" text-anchor="middle" fill="#e6edf3" font-size="15">lead</text>

  <!-- lead -> members -->
  <line x1="376" y1="204" x2="558" y2="98" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="376" y1="210" x2="558" y2="158" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="376" y1="216" x2="558" y2="218" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="452" y="132" fill="#8b949e" font-size="12">staffs, up to six</text>

  <!-- members -->
  <rect x="565" y="78" width="145" height="40" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
  <text x="637" y="103" text-anchor="middle" fill="#e6edf3" font-size="14">member · api</text>
  <rect x="565" y="138" width="145" height="40" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
  <text x="637" y="163" text-anchor="middle" fill="#e6edf3" font-size="14">member · tests</text>
  <rect x="565" y="198" width="145" height="40" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
  <text x="637" y="223" text-anchor="middle" fill="#e6edf3" font-size="14">member · docs</text>

  <!-- team <-> board -->
  <line x1="430" y1="276" x2="430" y2="314" stroke="#8b949e" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- TEAM.md -->
  <rect x="300" y="320" width="260" height="64" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
  <text x="430" y="347" text-anchor="middle" fill="#e6edf3" font-size="15" font-family="ui-monospace, Menlo, Consolas, monospace">.team/TEAM.md</text>
  <text x="430" y="368" text-anchor="middle" fill="#8b949e" font-size="12">roster · task board · decisions</text>

  <text x="585" y="356" fill="#8b949e" font-size="12">claim → work → verify → done</text>
</svg>
