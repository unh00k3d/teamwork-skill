<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" role="img" aria-label="A teamwork mission starting in the terminal" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14">
  <rect x="1" y="1" width="718" height="390" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <circle cx="26" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="22" r="6" fill="#febc2e"/>
  <circle cx="66" cy="22" r="6" fill="#28c840"/>
  <line x1="1" y1="42" x2="719" y2="42" stroke="#30363d" stroke-width="1.5"/>

  <text x="28" y="74"><tspan fill="#2dd4a7">$</tspan><tspan fill="#e6edf3" x="46">claude</tspan></text>
  <text x="28" y="96"><tspan fill="#8b949e">&gt;</tspan><tspan x="46" fill="#2dd4a7">/teamwork</tspan><tspan fill="#e6edf3"> port the API layer to the new client</tspan></text>

  <circle cx="33" cy="135" r="5" fill="#2dd4a7"/>
  <text x="46" y="140" fill="#8b949e">scaffolded .team/  (PROTOCOL.md · TEAM.md · handoffs/)</text>
  <circle cx="33" cy="157" r="5" fill="#2dd4a7"/>
  <text x="46" y="162" fill="#8b949e">lead spawned in tmux: team-api-port-lead</text>

  <text x="28" y="206"><tspan fill="#2dd4a7">$</tspan><tspan fill="#e6edf3" x="46">tmux ls</tspan></text>
  <text x="46" y="228" fill="#8b949e">team-api-port-lead:   1 windows</text>
  <text x="46" y="250" fill="#8b949e">team-api-port-api:    1 windows</text>
  <text x="46" y="272" fill="#8b949e">team-api-port-tests:  1 windows</text>

  <text x="28" y="316"><tspan fill="#2dd4a7">$</tspan><tspan fill="#e6edf3" x="46">cat .team/TEAM.md</tspan></text>
  <text x="46" y="338" fill="#8b949e">| 1 | port client calls       | claimed | api |</text>
  <text x="46" y="360" fill="#8b949e">| 2 | integration suite green | open    |     |</text>
</svg>
